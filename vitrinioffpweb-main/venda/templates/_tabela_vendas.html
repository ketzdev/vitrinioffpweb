{% if vendas %}
<div class="table-responsive">
<table class="table table-striped table-hover tabela-vitrine">
    <thead>
        <tr>
            <th scope="col">Código</th>
            <th scope="col">Cliente</th>
            <th scope="col">Data</th>
            <th scope="col">Valor total</th>
            <th scope="col">Pagamento</th>
            <th scope="col">Itens</th>
        </tr>
    </thead>
    <tbody>
        {% for v in vendas %}
        <tr>
            <td>{{ v.id }}</td>
            <td>{{ v.cliente_cpf.nome }}</td>
            <td>{{ v.data|date:"d/m/Y" }}</td>
            <td>R$ {{ v.valor_total }}</td>
            <td>{{ v.get_forma_pagamento_display }}</td>
            <td><a href="{% url 'ConsultaItensVenda' v.id %}">Ver itens</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% else %}
<p class="text-muted fst-italic">Nenhuma venda encontrada.</p>
{% endif %}
