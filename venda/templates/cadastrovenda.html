{% extends 'base.html' %}
{% load bootstrap5 %}
{% block titulo %}Registrar Venda{% endblock %}
{% block conteudo %}
<div class="cadastro-container">
    <section class="cadastro-card">
        <div class="cadastro-header"><h1>Registrar Venda</h1></div>
        <form action="{% url 'CadastraVenda' %}" method="POST" class="form">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">Registrar e adicionar itens</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Voltar</a>
        </form>
    </section>
</div>
{% endblock %}
