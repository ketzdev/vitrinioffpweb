{% load bootstrap5 %}
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Vitrine Off{% endblock %}</title>
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
    <header class="topo">
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'index' %}">Vitrine Off</a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Página inicial</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="conteudo">
        {% bootstrap_messages %}
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">Vitrine Off &copy; — Projeto Django | IFSC</footer>
</body>
</html>
