{% if produtos %}
<div class="table-responsive">
<table class="table table-striped table-hover align-middle tabela-vitrine">
    <thead>
        <tr>
            <th scope="col">Imagem</th>
            <th scope="col">Nome</th>
            <th scope="col">Categoria</th>
            <th scope="col">Valor</th>
            <th scope="col">Quantidade</th>
        </tr>
    </thead>
    <tbody>
        {% for p in produtos %}
        <tr>
            <td>
                {% if p.imagem %}
                <img src="{{ p.imagem.url }}" alt="{{ p.nome }}" width="60" height="60" style="object-fit:cover;border-radius:6px;">
                {% else %}—{% endif %}
            </td>
            <td>{{ p.nome }}</td>
            <td>{{ p.get_cat_produto_display }}</td>
            <td>R$ {{ p.valor }}</td>
            <td>{{ p.quantidade }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% else %}
<p class="text-muted fst-italic">Nenhum produto encontrado.</p>
{% endif %}
